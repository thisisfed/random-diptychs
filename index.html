  <!-- ═══════════════════════════════════════════════
       FAST-PATH DETECTOR

       Sets `html.has-sig-cache` BEFORE first paint when the
       signature cache (written by previous visits via app.js's
       pagehide handler) holds at least one entry. It no longer
       hides the splash's counter line: that now counts from 0 to
       the number of pairs on every visit. The class is still what the preload
       block below reads to choose its route.

       Why inline + synchronous: by the time app.js (deferred)
       runs, the splash has already painted with whatever the
       static HTML says. Hiding the loading line from JS later
       produces a visible flash. Reading localStorage in a
       sync script in <head> is fast (~1ms) and lands the
       class before the body parses.

       Wrapped in try/catch because localStorage throws in iOS
       private browsing, when storage is disabled, or when
       parent-frame restrictions block access. Failure is a
       no-op — the loading line stays visible, which is the
       honest behaviour when we can't determine whether the
       reload will be fast.
  ═══════════════════════════════════════════════ -->
  <script>
    (function () {
      try {
        /* Preferred path: a tiny sidecar key written alongside ff_signatures
           by writeSignatureCache(). Parsing the full signature blob here —
           ~150 entries with palette and Sobel fields — is tens of
           milliseconds of synchronous main-thread work on the critical path
           before first paint, to answer a yes/no question. */
        var meta = localStorage.getItem('ff_sig_meta');
        if (meta) {
          var m = JSON.parse(meta);
          if (m && m.v === 4 && m.n > 0) {
            document.documentElement.classList.add('has-sig-cache');
          }
          return;
        }
        /* Fallback for anyone whose last visit predates ff_sig_meta. Costs
           the old full parse exactly once; their next pagehide writes the
           meta key and this branch never runs again. */
        var raw = localStorage.getItem('ff_signatures');
        if (!raw) return;
        var parsed = JSON.parse(raw);
        /* Keep this version constant in sync with SIG_CACHE_VERSION
           in app.js. If app.js bumps the version (analyzeImage
           algorithm change, or signature schema change like adding
           the aspect field in v2, or the Sobel structural fields in
           v3), the stored signatures are stale and the loading line
           SHOULD appear — fresh analysis is about to run for every
           image. */
        if (!parsed || parsed.v !== 4) return;
        if (!parsed.sigs || typeof parsed.sigs !== 'object') return;
        if (Object.keys(parsed.sigs).length > 0) {
          document.documentElement.classList.add('has-sig-cache');
        }
      } catch (e) { /* private browsing / disabled storage — fall through */ }
    })();
  </script>

<!-- First-pair hint. Shown ONCE, over the very first diptych: "tap anywhere"
     on touch, "click anywhere" on pointer (text set by showFirstPairHint in
     app.js). Lime (the site accent), fades in fast, holds ~1s, fades out and
     is removed — and dismissed early the moment the visitor advances. Never
     reappears. pointer-events:none so the tap/click it invites passes through
     to the diptych. -->
<div id="first-hint" aria-hidden="true"></div>

<!-- "click click click" — appears with the first pair, at the foot of the
     screen, above the analytics banner when that is showing. Filled and
     positioned by showClickHint() in app.js, removed on the first click. -->
<div id="click-hint" aria-hidden="true"></div>

<div id="contact" class="interlude" aria-hidden="true">
  <div class="inner">
    <a class="line" id="contact-email" rel="nofollow"></a>
  </div>
</div>

<div id="share" class="interlude" aria-hidden="true">
  <div class="inner">
    <!-- The no-back rule lives here. The opening card now carries the why
         text for the first pair rather than any instructions, so this
         interlude — shown every session, by pair 5 at the latest — is the
         one reliable place the gallery states there is no going back. Two
         short sentences: the mechanism, then the consequence. -->
    <span class="line">No back button</span>
    <!-- Why-panel hint. The "why this pair" panel (see WHY THIS PAIR? in

         two fingers on a trackpad. There is no key for it. setShareTriggerLabel() in app.js sets this line's

         shows it on both; the #why-hint CSS keeps it hidden until that `show` class is

         gently surfaced: a single line on a single-use card, not persistent
         UI chrome. The text below is a placeholder, overwritten at init. -->
  </div>
</div>

<div id="welcome" class="interlude" aria-hidden="true">
  <div class="inner">
    <span class="line">Evolving concept on iPhone</span>
  </div>
</div>

<!-- "Why this pair?" panel — opened by swiping up (touch, or two

     centred type, black bg, asymmetric 0.8s/0.2s fade) but opts
     out of the main .interlude click-dismiss flow (which coordinates
     a next-pair load via interludePreload — wrong here, since the
     pair behind the panel stays put). The opt-out is handled exactly
     like #consent's: an `if (el.id === 'why') return` near the top of

<div id="why" class="interlude" aria-hidden="true">
  <div class="inner">
    <span class="line" id="why-line-2"></span>
  </div>
</div>

<div id="consent" class="interlude" aria-hidden="true">
  <div class="inner">
    <span class="line"><a id="consent-accept" role="button">Accept</a> / <a id="consent-decline" role="button">Decline</a>, <a id="consent-why" role="button">Why?</a></span>
  </div>
</div>

<!-- Share toast — brief "Link copied" overlay shown after the user
     triggers a share via S key (desktop) or long-press (mobile). -->
<div id="share-toast" aria-live="polite" aria-hidden="true">
  <span id="share-toast-text">Link copied</span>
</div>

<!-- Rotate prompt — shown only when the visitor is on a touch device
     held in landscape orientation. The diptych is designed for portrait
     viewing, where the two panels each get the full visible height. In
     landscape on a phone, the panels collapse to short wide strips that
     don't show photography well. Visibility is controlled purely by CSS
     media query (see styles.css) — no JS, no class toggling. Rotating
     the device back to portrait dismisses the prompt automatically. -->
<div id="rotate-prompt" aria-hidden="true">
  <div class="inner">
    <span class="line">Please rotate your device</span>
    <span class="line">to portrait</span>
  </div>
</div>
